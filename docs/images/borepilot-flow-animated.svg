<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460"><style>
.t{font-family:'Segoe UI',Arial,sans-serif}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-36}}
@keyframes appear{0%,2%{opacity:0;transform:translateX(-14px)}8%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
</style>
<rect width="1200" height="460" rx="26" fill="#0a1630"/>
<text class="t" x="600" y="46" text-anchor="middle" fill="#3fd0ff" font-size="25" font-weight="700">How BorePilot works</text>
<g class="t"><rect x="40" y="150" width="230" height="100" rx="16" fill="#12263f" stroke="#3fd0ff" stroke-width="2"/><text x="155.0" y="186" text-anchor="middle" fill="#f0f6ff" font-size="21" font-weight="700">Home Assistant</text><text x="155.0" y="212" text-anchor="middle" fill="#96afcd" font-size="14">dashboard, phone, automations</text></g>
<g class="t"><rect x="390" y="120" width="250" height="160" rx="16" fill="#12263f" stroke="#2fbf71" stroke-width="2"/><text x="515.0" y="156" text-anchor="middle" fill="#f0f6ff" font-size="21" font-weight="700">BorePilot</text><text x="515.0" y="182" text-anchor="middle" fill="#96afcd" font-size="14">ESP32-S3, HLK 5 V, relays, display</text></g>
<g class="t"><rect x="760" y="60" width="200" height="90" rx="16" fill="#12263f" stroke="#f4c20d" stroke-width="2"/><text x="860.0" y="96" text-anchor="middle" fill="#f0f6ff" font-size="21" font-weight="700">Relay 1</text><text x="860.0" y="122" text-anchor="middle" fill="#96afcd" font-size="14">START contactor</text></g>
<g class="t"><rect x="760" y="250" width="200" height="90" rx="16" fill="#12263f" stroke="#f4c20d" stroke-width="2"/><text x="860.0" y="286" text-anchor="middle" fill="#f0f6ff" font-size="21" font-weight="700">Relay 2</text><text x="860.0" y="312" text-anchor="middle" fill="#96afcd" font-size="14">STOP / spare, NO + NC</text></g>
<g class="t"><rect x="1010" y="150" width="160" height="100" rx="16" fill="#12263f" stroke="#ff6b6b" stroke-width="2"/><text x="1090.0" y="186" text-anchor="middle" fill="#f0f6ff" font-size="21" font-weight="700">Pump</text><text x="1090.0" y="212" text-anchor="middle" fill="#96afcd" font-size="14">single phase, 230 V</text></g>
<g class="t"><rect x="390" y="350" width="250" height="80" rx="16" fill="#12263f" stroke="#3fd0ff" stroke-width="2"/><text x="515.0" y="386" text-anchor="middle" fill="#f0f6ff" font-size="21" font-weight="700">PZEM-004T</text><text x="515.0" y="412" text-anchor="middle" fill="#96afcd" font-size="14">V, A, W, kWh, Hz</text></g>
<g class="t"><rect x="40" y="350" width="230" height="80" rx="16" fill="#12263f" stroke="#96afcd" stroke-width="2"/><text x="155.0" y="386" text-anchor="middle" fill="#f0f6ff" font-size="21" font-weight="700">Tank node</text><text x="155.0" y="412" text-anchor="middle" fill="#96afcd" font-size="14">ESP-NOW level (optional)</text></g>
<path id="a1" d="M270 190 L390 190" fill="none" stroke="#3fd0ff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#3fd0ff"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath href="#a1"/></animateMotion></circle>
<path id="a2" d="M390 215 L270 215" fill="none" stroke="#3fd0ff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#3fd0ff"><animateMotion dur="3s" begin="0.6s" repeatCount="indefinite" calcMode="linear"><mpath href="#a2"/></animateMotion></circle>
<path id="a3" d="M640 170 C700 170 700 105 760 105" fill="none" stroke="#2fbf71" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#2fbf71"><animateMotion dur="2s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath href="#a3"/></animateMotion></circle>
<path id="a4" d="M640 230 C700 230 700 295 760 295" fill="none" stroke="#2fbf71" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#2fbf71"><animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" calcMode="linear"><mpath href="#a4"/></animateMotion></circle>
<path id="a5" d="M960 105 C1000 105 1000 185 1010 190" fill="none" stroke="#f4c20d" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#f4c20d"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite" calcMode="linear"><mpath href="#a5"/></animateMotion></circle>
<path id="a6" d="M960 295 C1000 295 1000 215 1010 210" fill="none" stroke="#f4c20d" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#f4c20d"><animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite" calcMode="linear"><mpath href="#a6"/></animateMotion></circle>
<path id="a7" d="M515 350 L515 280" fill="none" stroke="#3fd0ff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#3fd0ff"><animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath href="#a7"/></animateMotion></circle>
<path id="a8" d="M270 385 C330 385 340 300 390 270" fill="none" stroke="#96afcd" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 8" style="animation:dash 1.6s linear infinite"/><circle r="6" fill="#96afcd"><animateMotion dur="3s" begin="0.2s" repeatCount="indefinite" calcMode="linear"><mpath href="#a8"/></animateMotion></circle>
<text class="t" x="330" y="180" text-anchor="middle" fill="#96afcd" font-size="14">Wi-Fi</text>
<g transform="translate(1090 296)"><g style="transform-origin:0 0;animation:spin 2.2s linear infinite"><circle r="20" fill="none" stroke="#ff6b6b" stroke-width="3"/><path d="M0 0 L16 -6 M0 0 L-12 12 M0 0 L-4 -17" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/></g></g>
<g fill="#3fd0ff"><circle cx="1070" cy="400" r="5"><animate attributeName="cy" values="380;430" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>
<circle cx="1100" cy="400" r="5"><animate attributeName="cy" values="380;430" dur="1.6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle>
<circle cx="1130" cy="400" r="5"><animate attributeName="cy" values="380;430" dur="1.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle></g>
</svg>