<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Segoe UI,Arial,sans-serif">
<rect width="1200" height="420" rx="24" fill="#0a1630"/>
<text x="600" y="44" text-anchor="middle" fill="#3fd0ff" font-size="24" font-weight="700">How BorePilot works</text>
<rect x="40" y="150" width="230" height="100" rx="16" fill="#12263f" stroke="#3fd0ff" stroke-width="2"/><text x="155.0" y="188" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Home Assistant</text><text x="155.0" y="216" text-anchor="middle" fill="#96afcd" font-size="15">phone, dashboard, automations</text>
<rect x="380" y="130" width="250" height="140" rx="16" fill="#12263f" stroke="#2fbf71" stroke-width="2"/><text x="505.0" y="168" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">BorePilot</text><text x="505.0" y="196" text-anchor="middle" fill="#96afcd" font-size="15">ESP32-S3 + HLK 5 V + relays</text>
<rect x="740" y="70" width="210" height="90" rx="16" fill="#12263f" stroke="#f4c20d" stroke-width="2"/><text x="845.0" y="108" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Relay 1</text><text x="845.0" y="136" text-anchor="middle" fill="#96afcd" font-size="15">START contactor / pump</text>
<rect x="740" y="240" width="210" height="90" rx="16" fill="#12263f" stroke="#f4c20d" stroke-width="2"/><text x="845.0" y="278" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Relay 2</text><text x="845.0" y="306" text-anchor="middle" fill="#96afcd" font-size="15">STOP / spare, NO + NC</text>
<rect x="1000" y="150" width="170" height="100" rx="16" fill="#12263f" stroke="#ff6b6b" stroke-width="2"/><text x="1085.0" y="188" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Pump</text><text x="1085.0" y="216" text-anchor="middle" fill="#96afcd" font-size="15">single phase, 230 V</text>
<rect x="380" y="320" width="250" height="80" rx="16" fill="#12263f" stroke="#3fd0ff" stroke-width="2"/><text x="505.0" y="358" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">PZEM-004T</text><text x="505.0" y="386" text-anchor="middle" fill="#96afcd" font-size="15">V, A, W, kWh, Hz</text>
<rect x="40" y="320" width="230" height="80" rx="16" fill="#12263f" stroke="#96afcd" stroke-width="2"/><text x="155.0" y="358" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Tank node (optional)</text><text x="155.0" y="386" text-anchor="middle" fill="#96afcd" font-size="15">ESP-NOW level</text>
<line x1="270" y1="200" x2="380" y2="200" stroke="#3fd0ff" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="3s" repeatCount="indefinite"/></line><polygon points="380,200 370,194 370,206" fill="#3fd0ff"/><line x1="380" y1="215" x2="270" y2="215" stroke="#3fd0ff" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="4s" repeatCount="indefinite"/></line><polygon points="270,215 280,209 280,221" fill="#3fd0ff"/>
<line x1="630" y1="170" x2="740" y2="115" stroke="#2fbf71" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="3s" repeatCount="indefinite"/></line><polygon points="740,115 730,109 730,121" fill="#2fbf71"/><line x1="630" y1="230" x2="740" y2="285" stroke="#2fbf71" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="3s" repeatCount="indefinite"/></line><polygon points="740,285 730,279 730,291" fill="#2fbf71"/>
<line x1="950" y1="115" x2="1000" y2="185" stroke="#f4c20d" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="3s" repeatCount="indefinite"/></line><polygon points="1000,185 990,179 990,191" fill="#f4c20d"/><line x1="950" y1="285" x2="1000" y2="215" stroke="#f4c20d" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="3s" repeatCount="indefinite"/></line><polygon points="1000,215 990,209 990,221" fill="#f4c20d"/>
<line x1="505" y1="320" x2="505" y2="270" stroke="#3fd0ff" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="3s" repeatCount="indefinite"/></line><polygon points="505,270 515,264 515,276" fill="#3fd0ff"/>
<line x1="270" y1="360" x2="380" y2="300" stroke="#96afcd" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="36" to="0" dur="5s" repeatCount="indefinite"/></line><polygon points="380,300 370,294 370,306" fill="#96afcd"/>
<text x="325" y="190" text-anchor="middle" fill="#96afcd" font-size="14">Wi-Fi</text>
</svg>